name: University Study CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-tests:
    name: ${{ matrix.os }} · Python 3.11
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install complete study environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install chromium
          python -m pip check

      - name: Complete environment preflight
        run: python scripts/setup_env.py check --json

      - name: MCP preflight
        run: python study.py mcp preflight --json

      - name: Verify generated agent assets
        run: python scripts/sync_agent_assets.py verify

      - name: Stressed materials benchmark
        run: python scripts/stressed_materials.py benchmark

      - name: PDF stress benchmark
        run: python scripts/pdf_stress.py benchmark

      - name: Semantic contradiction benchmark
        run: python scripts/semantic_claims.py benchmark

      - name: Claim extraction benchmark
        run: python scripts/claim_candidates.py benchmark

      - name: Run release suite
        run: python tests/run_release_tests.py
