name: University Study CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-tests:
    name: ${{ matrix.os }} · Python 3.11
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create isolated project venv
        run: python -m venv .venv

      - name: Install complete study environment
        run: |
          python scripts/venv_exec.py -m pip install --upgrade pip
          python scripts/venv_exec.py -m pip install -r requirements.txt
          python scripts/venv_exec.py -m playwright install chromium
          python scripts/venv_exec.py -m pip check

      - name: Complete environment preflight
        run: python scripts/venv_exec.py scripts/setup_env.py check --json

      - name: MCP preflight
        run: python scripts/venv_exec.py study.py mcp preflight --json

      - name: Verify generated agent assets
        run: python scripts/venv_exec.py scripts/sync_agent_assets.py verify

      - name: Stressed materials benchmark
        run: python scripts/venv_exec.py scripts/stressed_materials.py benchmark

      - name: PDF stress benchmark
        run: python scripts/venv_exec.py scripts/pdf_stress.py benchmark

      - name: Semantic contradiction benchmark
        run: python scripts/venv_exec.py scripts/semantic_claims.py benchmark

      - name: Claim extraction benchmark
        run: python scripts/venv_exec.py scripts/claim_candidates.py benchmark

      - name: Run release suite
        run: python scripts/venv_exec.py tests/run_release_tests.py
